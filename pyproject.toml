[project]
name = "vllm-optimizer"
version = "0.26.0"
description = "Deterministic vLLM optimization lab with dry-run remote safety."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vllm-optimizer = "vllm_optimizer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
