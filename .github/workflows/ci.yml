name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  verify:
    name: Test and release-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest

      - name: Run release-check
        run: >
          uv run vllm-optimizer release-check
          --out artifacts/catalog/release-check.json
          --markdown-out artifacts/catalog/release-check.md

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install pinned UI QA dependencies
        run: npm ci

      - name: Audit UI QA dependencies
        run: npm audit --audit-level=high
